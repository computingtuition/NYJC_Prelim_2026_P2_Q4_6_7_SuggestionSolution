<!DOCTYPE html>
<html>
  <head>
    <title>Equipment</title>
    <link href="/static/STYLES.css" rel="stylesheet"> 
  </head>

  <body>
    <h1>View Inventory</h1>
    <table>
      <tr>
        <th>Key</th>
        <th>Value</th>
      </tr>
      {% for row in data %}
      <tr>
        <td>{{ row[0] }}</td>
        <td>{{ row[1] }}</td>
      </tr>
      {% endfor %}
    </table>
  </body>
</html>
